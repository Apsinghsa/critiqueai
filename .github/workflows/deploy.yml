name: Build & Deploy CritiqueAI

on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/**', '.github/workflows/**']

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE: ghcr.io/apsinghsa/critiqueai-backend

jobs:
  build-and-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VPS
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.yml"
          target: "~/critiqueai"

      - name: Write prod.env, pull & restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEN_API2: ${{ secrets.GEN_API2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: 'GEN_API2,SUPABASE_URL,SUPABASE_SERVICE_KEY,CORS_ORIGINS'
          script: |
            cd ~/critiqueai/deploy
            cat > prod.env <<EOF
            GEN_API2=${GEN_API2}
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
            CORS_ORIGINS=${CORS_ORIGINS}
            EOF
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose --env-file prod.env pull
            docker compose --env-file prod.env up -d
            docker image prune -f